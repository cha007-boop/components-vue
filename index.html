<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Vue components</title>
  <!-- Import Styles -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- Import Vue.js -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <div class="nav-bar"></div>

    <h1>{{ intro }}</h1>

    <add-book :headerText="headerText" @add-book="AddBook"></add-book>
    <h1>_____________________________</h1>
    <H2>Show all the books</H2>
    <book-details :booklist="books"></book-details>

  </div>

  <!-- Import App -->
  <script src="./js/main.js"></script>

  <!-- Import Components -->
  <script src="./components/BookDetails.js"></script>
  <script src="./components/AddBook.js"></script>


  <!-- Mount App -->
  <script>
    const mountedApp = app.mount('#app')
  </script>
</body>

</html>
